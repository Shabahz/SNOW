version: '3.9'
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: budget
      POSTGRES_USER: budget
      POSTGRES_PASSWORD: budget
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://budget:budget@db:5432/budget
      JWT_SECRET: dev-secret
      TOKEN_ENCRYPTION_KEY: local-dev-key
      PLAID_ENV: sandbox
      PLAID_CLIENT_ID: ${PLAID_CLIENT_ID:-}
      PLAID_SECRET: ${PLAID_SECRET:-}
      PLAID_WEBHOOK_URL: ${PLAID_WEBHOOK_URL:-}
    ports:
      - "8000:8000"
    depends_on:
      - db
    volumes:
      - ./backend:/app

volumes:
  pg_data:
